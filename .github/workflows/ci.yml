name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Host facts
        run: |
          sw_vers
          csrutil status || true

      - name: Secret scan (gitleaks)
        run: |
          brew install gitleaks
          gitleaks git --no-banner --redact .

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Tauri build script needs the helper sidecar to exist (see install.sh).
      - name: Build Secure Enclave helper
        run: |
          (cd se-helper && swift build -c release)
          mkdir -p app/src-tauri/binaries
          cp se-helper/.build/release/karambit-se-helper \
            "app/src-tauri/binaries/karambit-se-helper-$(rustc -vV | awk '/^host/{print $2}')"

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The GUI crate has no Rust tests and is built above. Tests that need a real
      # Secure Enclave or Touch ID are not part of the default run.
      # Manual runs only: several process/signal tests are timing-sensitive on shared
      # runners. Run them with "Run workflow" (workflow_dispatch) or locally.
      - name: Rust tests
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --workspace --exclude karambit-gui

      - name: UI tests
        run: |
          cd app
          npm ci
          npm test
