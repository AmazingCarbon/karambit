[package]
name = "karambit-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
age = "0.11"
aho-corasick = "1"
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
time = "0.3"
zeroize = "1"
