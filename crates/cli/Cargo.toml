[package]
name = "karambit-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rpassword = "7"
serde_json = "1"
karambit-core = { version = "0.1.0", path = "../core" }
zeroize = "1"
age = "0.11"

[[bin]]
name = "karambit"
path = "src/main.rs"
